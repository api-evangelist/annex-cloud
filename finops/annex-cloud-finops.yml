description: >-
  FinOps view of Annex Cloud spend. Annex Cloud is an enterprise loyalty and
  customer retention platform sold on custom contracts through sales and
  Customer Success; API access is bundled into the platform subscription rather
  than billed as a standalone metered API. There is no public per-call pricing,
  so cost is a negotiated annual platform fee typically scaled to loyalty
  program size (member volume, modules, and services) rather than a usage meter
  a customer self-manages via an invoice line item. The meters below describe
  the business dimensions a customer would track internally to reason about
  value, not published Annex Cloud billing units.
notes: >-
  No public rate card exists; all commercial terms are contact-sales. Verify
  the actual billing model and any usage components directly with Annex Cloud
  during reconciliation.
sources:
- https://www.annexcloud.com/
- https://www.annexcloud.com/api-documentation/
